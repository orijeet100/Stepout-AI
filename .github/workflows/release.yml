name: release

on:
  push:
    tags: ['v*']
    branches: ['feat/**']  # build and smoke-test on a clean Windows runner; only a tag is released
  workflow_dispatch:

jobs:
  wheel:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Built page goes to src/stepout/_web, which ships inside the wheel.
      - name: Build the web page
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        shell: bash
        run: uv build --wheel

      - name: Smoke-test a clean install of the wheel
        shell: bash
        run: uv run --no-project python scripts/smoke_install.py dist/*.whl

      - name: Publish the wheel to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wheel=$(basename dist/*.whl)
          gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" \
            --notes "Install: uv tool install https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$wheel"

      - name: Keep the wheel as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stepout-wheel
          path: dist/*.whl
