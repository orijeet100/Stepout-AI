# Copy to data/config/grants.toml (git-ignored). Only you edit it; the Assistant and the model cannot.
#   mode = "metadata": names, sizes, dates and counts.   mode = "read": also file contents (used by the Reader).
# The built-in block list always applies: .ssh, .env, key files, browser profiles, Windows, Program Files, the Assistant's folder.

[[grant]]
path = 'D:\Documents'
mode = "metadata"
