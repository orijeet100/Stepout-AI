[project]
name = "stepout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "anthropic>=0.40",
    "httpx>=0.27",
    "mem0ai==2.2.1",  # the learned-memory store (ADR 0016); pinned: its search and listing calls are what the adapter is written to
    "playwright>=1.59",  # page.screencast (the live view) arrived in 1.59
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=2.54,<3",  # the model layer under any provider (OpenRouter, OpenAI, ...); see docs/adr/0011
    "pypdf>=6.19",  # the Reader: text from PDFs (BSD-3-Clause)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not eval'"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["eval: costs money, run explicitly"]
