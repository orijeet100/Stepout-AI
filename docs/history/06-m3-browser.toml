[[decision]]
what = "Use the installed Chrome through Playwright, headless, with a fresh context per Run. Read-only: the agent can open a URL, click a numbered link or read more; it cannot type, press buttons or submit forms."
why = "No browser download, and the User's everyday Chrome and logins stay out of reach."
ref = "src/stepout/browser.py"

[[decision]]
what = "Redirects are never followed by the browser: `route.fetch(max_redirects=0)`, and each redirect hop is checked by us before any request is made. Page WebSockets and media are blocked. DNS verdicts are cached per host and port."
why = "Playwright follows redirects itself, which would let a public page bounce the browser to a private address."
ref = "src/stepout/browser.py"

[[decision]]
what = "Only a Role's newest two page views stay in full in its notes; older ones shrink to address and title."
why = "Page views are the heaviest content in a Role's notes, and the notes are resent on every call."
ref = "src/stepout/runner.py"

[[decision]]
what = "A plan starts its own first step, and repeated identical hand actions are not re-run."
why = "One Sonnet call fewer per Task; the model is told 'results are above' instead of being asked again."
ref = "src/stepout/runner.py"
