[[decision]]
what = "The Orchestrator writes the Plan as data; there is no separate Planner agent."
why = "The agent that sees the Findings is the one that must re-plan. A separate Planner adds a model call and a hand-off that loses information."
ref = "adr/0010-one-loop-many-roles.md"

[[decision]]
what = "Reading file contents is its own Role (Reader) and returns Findings; the Orchestrator never holds raw file text."
why = "File text reaching the model should happen in one visible, budgeted, Taint-setting step."
ref = "adr/0010-one-loop-many-roles.md"

[[decision]]
what = "V0-basic is read-only: typing, submitting, uploading, downloading, moving and deleting are refused until Approvals exist (S3)."
why = "No Approvals yet, so nothing that changes the world."
ref = "game-plan.md"

[[decision]]
what = "One $1 Budget per Run, shared by every Role, and at most 3 web searches."
why = "Orchestration adds model calls; a shared cap bounds the cost."
ref = "game-plan.md"

[[decision]]
what = "After a file's contents have been read, web access is limited to sites the User named in the request."
why = "A hostile document could otherwise leak what was read through the query string of a URL."
ref = "adr/0010-one-loop-many-roles.md"

[[decision]]
what = "The browser is a fresh, headless Chrome; never the User's everyday Chrome."
why = "Their logged-in tabs would be reachable by whatever a hostile page talks the model into."
ref = "adr/0010-one-loop-many-roles.md"

[[decision]]
what = "Third-party skills are installed only if used, after being read, and recorded with their licence."
why = "Skills steer the agent, and every skill's description sits in context each session."
ref = "third-party.md"
