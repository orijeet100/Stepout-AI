[[decision]]
what = "Resolve the real path first, then check the fixed block list, then the Grants. The block list is code, not config; no Grant widens it."
why = "Links, junctions and 8.3 short names fool a check done on the path string. Fixed rules in code cannot be widened by a Grant, the model or the chat (ADR 0008)."
ref = "src/stepout/files.py"

[[decision]]
what = "Whole `C:` and `D:` are granted in read mode, minus the block list (`.ssh`, `.env`, keys, browser profiles, Windows credentials, Windows, Program Files, the Assistant's own folder)."
why = "The User's call: broad reach, with the secrets kept out."
ref = "grants.example.toml"

[[decision]]
what = "No full-drive scans. `find` refuses a drive root; counts stop at 60 s and say PARTIAL; when unsure the agent asks which folder."
why = "The User's call. Smarter search (ask with options, rank folders, prune junk, fuzzy names) is parked in the game plan."
ref = "game-plan.md"

[[decision]]
what = "`stat` is folded into `list`: one `files` tool with an `op`."
why = "Follows the tool-design guidance: one tool with an `op`, not three near-identical tools."
ref = "src/stepout/model.py"

[[decision]]
what = "The Gate allows the `files` kind; the Files module enforces paths."
why = "Resolving a real path needs the disk, and the Gate is a pure function."
ref = "src/stepout/gate.py"

[[decision]]
what = "A Grant's `mode` is parsed and validated, but only the Reader (M4) will enforce `read`."
why = "M2 never reads contents, so there is nothing for the mode to gate yet."
ref = "src/stepout/files.py"
