[[decision]]
what = "No forced `tool_choice`; tool choice is automatic and a text-only reply counts as the answer."
why = "The official docs say newer models (Opus 5.5, Sonnet 5.5) reject `tool_choice: any`."
ref = "src/stepout/model.py"

[[decision]]
what = "Web search uses the basic `web_search_20250305` tool, with `max_uses` set to the searches the Run has left."
why = "The 20260209+ versions default to dynamic filtering through code execution, which Haiku cannot use."
ref = "src/stepout/model.py"

[[decision]]
what = "Migrations are tracked with `PRAGMA user_version`, so existing databases upgrade in place."
why = "ALTER statements must run exactly once; with a version number an existing database upgrades in place."
ref = "src/stepout/store.py"

[[decision]]
what = "One `step` event per model call (action, verdict and cost together) instead of separate model_call / verdict / action rows; `plan`, `return` and `stop` are the other kinds."
why = "Fewer rows to write and read; the Trace is the Ledger's events streamed live, so there is no second record."
ref = "src/stepout/runner.py"

[[decision]]
what = "A specialist sees its goal and what it has learned, never the Orchestrator's plan; delegation is one level deep."
why = "Context isolation and least privilege (ADR 0010)."
ref = "adr/0010-one-loop-many-roles.md"

[[decision]]
what = "No `ask_user` yet; the Orchestrator can ask in its final reply."
why = "Pausing for an answer needs pause/resume, which belongs to S3 (now iteration B5)."
ref = "game-plan.md"
