[[decision]]
what = "One agent loop that runs under a Role (system prompt, tool set, model, step cap): Orchestrator (no hands), Direct, Browser, Files. One loop function plus a Role table; computer use is out of V0."
why = "Specialists keep heavy context (page views, file text) out of the Orchestrator's; each Role can use the cheapest model that holds up; a Role with one hand is a smaller target for a poisoned page."
